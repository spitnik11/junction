name = "junction"
pages_build_output_dir = "public"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# D1 — bound as env.DB
[[d1_databases]]
binding = "DB"
database_name = "junction"
database_id = "6ea9a22e-2975-4f6a-b93d-43f21afb6f90"

# Workers AI — bound as env.AI (Hat 5 insight, free tier)
[ai]
binding = "AI"

# Secrets (NOT here) live in .dev.vars locally / `wrangler pages secret put` in prod:
#   STRIPE_SECRET_KEY      rk_test_... (restricted, test mode)
#   STRIPE_WEBHOOK_SECRET  whsec_...   (from `wrangler`/dashboard webhook)
#   SESSION_SECRET         any long random string
